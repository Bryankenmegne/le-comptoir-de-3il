<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre compte Le Comptoir de 3iL.">
    <title>Connexion | Le Comptoir de 3iL</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="site-header" id="site-header"></header>

    <main id="contenu">
        <div class="container auth-wrap">
            <div class="auth-card">
                <h1>Connexion</h1>
                <p class="intro">Connectez-vous pour commander et retrouver vos tickets de retrait.</p>
                <div id="form-alert" aria-live="polite"></div>
                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                        <p class="field-error" data-for="email"></p>
                    </div>
                    <div class="field">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <p class="field-error" data-for="password"></p>
                    </div>
                    <button type="submit" class="btn btn-block">Se connecter</button>
                </form>
                <p class="auth-switch">Pas encore de compte ? <a href="register.html" id="register-link">Créer un compte</a></p>
                <div class="demo-accounts">
                    <p><strong>Comptes de démonstration</strong></p>
                    <p>Admin : <code>admin@ecommerce.com</code> / <code>admin123</code></p>
                    <p>Client : <code>user@ecommerce.com</code> / <code>user123</code></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
