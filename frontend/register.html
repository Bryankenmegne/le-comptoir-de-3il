<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créez votre compte client sur Le Comptoir de 3iL.">
    <title>Créer un compte | Le Comptoir de 3iL</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="site-header" id="site-header"></header>

    <main id="contenu">
        <div class="container auth-wrap">
            <div class="auth-card">
                <h1>Créer un compte</h1>
                <p class="intro">Il vous servira à passer commande et à suivre vos livraisons.</p>
                <div id="form-alert" aria-live="polite"></div>
                <form id="register-form" novalidate>
                    <div class="field">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" autocomplete="name" maxlength="100" required>
                        <p class="field-error" data-for="nom"></p>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" maxlength="150" required>
                        <p class="field-error" data-for="email"></p>
                    </div>
                    <div class="field">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required aria-describedby="password-hint">
                        <span class="hint" id="password-hint">6 caractères minimum</span>
                        <p class="field-error" data-for="password"></p>
                    </div>
                    <div class="field">
                        <label for="confirm">Confirmer le mot de passe</label>
                        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
                        <p class="field-error" data-for="confirm"></p>
                    </div>
                    <button type="submit" class="btn btn-block">Créer mon compte</button>
                </form>
                <p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
