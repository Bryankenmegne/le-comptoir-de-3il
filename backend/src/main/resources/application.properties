# =====================================================================
# Configuration de l'application
# Chaque valeur ${VARIABLE:defaut} peut être remplacée par une variable
# d'environnement lors du déploiement (Render, Railway...).
# =====================================================================

spring.application.name=ecommerce-app

# Port : l'hébergeur fournit souvent la variable PORT
server.port=${PORT:8080}

# ---------- Base de données H2 en mémoire ----------
# Les données sont recréées à chaque démarrage à partir de data.sql
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 : http://localhost:8080/h2-console
# (JDBC URL : jdbc:h2:mem:ecommercedb, utilisateur : sa, mot de passe vide)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Exécute data.sql APRÈS la création des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- JWT ----------
# En production, définissez JWT_SECRET (au moins 32 caractères, gardé secret)
app.jwt.secret=${JWT_SECRET:dev-secret-a-changer-en-production-0123456789abcdef}
# Durée de validité du token : 24 h
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Origines autorisées à appeler l'API, séparées par des virgules (motifs * acceptés)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}

# ---------- Logs ----------
logging.level.com.ecommerce=INFO
